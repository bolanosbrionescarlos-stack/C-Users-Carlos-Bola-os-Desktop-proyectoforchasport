<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Mobile test harness</title>
    <style>
        body { font-family: monospace; margin: 0; padding: 12px; background: #111; color: #eee; }
        #frame { width: 390px; height: 700px; border: 3px solid #ff5500; background: #fff; display: block; }
        #status { margin: 8px 0; white-space: pre-wrap; }
    </style>
</head>

<body>
    <div id="status">listo</div>
    <iframe id="frame"></iframe>
    <script>
        const URLS = [
            '/', '/productos', '/producto/camiseta-dry-fit-pro', '/carrito', '/checkout',
            '/pedido/FS-261017-UDMLD', '/admin/login', '/admin', '/admin/pedidos',
            '/admin/pedidos/FS-261017-UDMLD', '/admin/productos', '/admin/productos/create',
            '/admin/categorias', '/admin/cupones', '/admin/configuracion',
        ];

        function load(frame, url) {
            return new Promise((resolve) => {
                frame.onload = () => setTimeout(resolve, 350);
                frame.src = url;
            });
        }

        function measure(frame, width) {
            const doc = frame.contentDocument;
            const win = frame.contentWindow;
            if (!doc || !win) return { overflow: -1, offenders: ['sin acceso (¿redirect o error?)'] };

            // Página de error / redirect a login
            const overflow = doc.documentElement.scrollWidth - width;
            const offenders = [];
            if (overflow > 1) {
                const all = doc.querySelectorAll('body *');
                for (const el of all) {
                    if (offenders.length >= 8) break;
                    const r = el.getBoundingClientRect();
                    if (r.width > 0 && r.right > width + 1) {
                        const cls = (el.className && el.className.baseVal !== undefined ? el.className.baseVal : el.className) || '';
                        offenders.push(
                            el.tagName.toLowerCase() +
                            (el.id ? '#' + el.id : '') +
                            (cls ? '.' + String(cls).trim().split(/\s+/).slice(0, 4).join('.') : '') +
                            ' → right=' + Math.round(r.right)
                        );
                    }
                }
            }
            return { overflow, offenders, title: doc.title };
        }

        window.runTest = async function (width) {
            const frame = document.getElementById('frame');
            frame.style.width = width + 'px';
            document.getElementById('status').textContent = 'probando a ' + width + 'px…';
            const results = [];

            for (const url of URLS) {
                await load(frame, url);
                const m = measure(frame, width);
                results.push({ url, ...m });
            }

            document.getElementById('status').textContent = 'listo (' + results.length + ' páginas)';
            return results;
        };
    </script>
</body>

</html>
